{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
<ul class="guide">
{{ range .Pages.ByDate.Reverse }}
<li><div class="row">
{{ with .Params.image }}<a class="thumb" href="{{ $.RelPermalink }}"><img src="{{ . }}" alt="{{ $.Params.image_alt }}" width="480" height="320" loading="lazy"></a>{{ end }}
<div>
<a class="title" href="{{ .RelPermalink }}">{{ .Title }}</a>
<p>{{ .Description }}</p>
<p class="meta">{{ .Date.Format "January 2, 2006" }} &middot; {{ .ReadingTime }} min read</p>
<a class="readmore" href="{{ .RelPermalink }}">Read the guide &rarr;</a>
</div></div></li>
{{ end }}
</ul>
{{ end }}
