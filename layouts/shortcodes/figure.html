{{/* figure shortcode: src, alt, caption, width, height, loading (default lazy),
   class (optional extra class on the <figure>, e.g. "map-figure"). */}}
{{ $src := .Get "src" }}
{{ if not (hasPrefix $src "/") }}{{ $src = printf "/%s" $src }}{{ end }}
<figure class="shortcode-figure{{ with .Get "class" }} {{ . }}{{ end }}">
<img src="{{ $src | relURL }}" alt="{{ .Get "alt" | default "" }}"{{ if .Get "width" }} width="{{ .Get "width" }}" height="{{ .Get "height" }}"{{ else }}{{ partial "photo-dims.html" $src | safeHTMLAttr }}{{ end }} loading="{{ .Get "loading" | default "lazy" }}">
{{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
