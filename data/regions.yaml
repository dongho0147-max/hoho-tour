# Regions data - single source of truth for home map, hubs, and nav.
# 3 layers: country / region / city. Hub URL pattern: /korea/<region>/ (expandable:
# /japan/<region>/ etc. for roadmap stages 2-4). Status: active = has guides,
# coming-soon = no guides yet (shown muted on the map, hub shows a note).
# Path ids refer to the province shapes in the home SVG map.
